<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Illustration: a radar sweep mapping competitors in a market">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".55" r=".75"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f1ebdf"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".45"/></linearGradient>
    <style>
      .sw{transform-origin:600px 280px;animation:spin 7s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .dot{animation:blink 3.5s ease-in-out infinite}
      .d2{animation-delay:1.1s}.d3{animation-delay:2.2s}
      @keyframes blink{50%{opacity:.25}}
      @media (prefers-reduced-motion:reduce){.sw,.dot{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <g fill="none" stroke="#f59e0b" stroke-opacity=".4">
    <circle cx="600" cy="280" r="70"/><circle cx="600" cy="280" r="140"/><circle cx="600" cy="280" r="210"/><circle cx="600" cy="280" r="280"/>
    <path d="M600 0 V520 M300 280 H900"/>
  </g>
  <path class="sw" d="M600 280 L880 280 A280 280 0 0 0 798 82 Z" fill="url(#sweep)"/>
  <g fill="#d97706">
    <circle class="dot" cx="690" cy="200" r="7"/><circle class="dot d2" cx="470" cy="330" r="6"/><circle class="dot d3" cx="760" cy="360" r="8"/>
    <circle class="dot d2" cx="540" cy="150" r="5"/><circle class="dot" cx="410" cy="220" r="5"/><circle class="dot d3" cx="650" cy="440" r="6"/>
  </g>
  <circle cx="600" cy="280" r="10" fill="#f59e0b"/>
  <g font-family="Inter,Arial,sans-serif" font-size="18" fill="#52525b">
    <text x="706" y="196">search</text><text x="776" y="356">maps</text><text x="352" y="216">AI answers</text><text x="484" y="336">reviews</text>
  </g>
</svg>
