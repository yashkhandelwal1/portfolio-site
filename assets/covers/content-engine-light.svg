<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Illustration: competitor articles flowing into a content roadmap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f6ecd9"/></linearGradient>
    <style>
      .flow{stroke-dasharray:8 10;animation:dash 2.4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-36}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <g>
    <rect x="120" y="120" width="200" height="250" rx="12" fill="#e4e4e7" transform="rotate(-6 220 245)"/>
    <rect x="150" y="110" width="200" height="250" rx="12" fill="#ececef" transform="rotate(3 250 235)"/>
    <rect x="180" y="130" width="200" height="250" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
    <g fill="#c4c4cc"><rect x="205" y="160" width="130" height="10" rx="5"/><rect x="205" y="185" width="150" height="8" rx="4" opacity=".6"/><rect x="205" y="203" width="140" height="8" rx="4" opacity=".6"/><rect x="205" y="221" width="110" height="8" rx="4" opacity=".6"/><rect x="205" y="255" width="150" height="8" rx="4" opacity=".6"/><rect x="205" y="273" width="120" height="8" rx="4" opacity=".6"/></g>
  </g>
  <g fill="none" stroke="#f59e0b" stroke-width="3">
    <path class="flow" d="M390 220 C500 220 520 160 620 160"/><path class="flow" d="M390 260 C500 260 520 260 620 260"/><path class="flow" d="M390 300 C500 300 520 360 620 360"/>
  </g>
  <circle cx="660" cy="260" r="56" fill="#f59e0b"/><circle cx="660" cy="260" r="34" fill="#fff7e6"/><circle cx="660" cy="260" r="12" fill="#fbbf24"/>
  <path d="M716 260 H790" stroke="#f59e0b" stroke-width="3"/>
  <g>
    <path d="M800 140 V400" stroke="#d4d4d8" stroke-width="3"/>
    <g fill="#f59e0b"><circle cx="800" cy="160" r="9"/><circle cx="800" cy="260" r="9"/><circle cx="800" cy="360" r="9"/></g>
    <g fill="#ffffff" stroke="#e4e4e7"><rect x="830" y="146" width="220" height="28" rx="6"/><rect x="830" y="246" width="260" height="28" rx="6"/><rect x="830" y="346" width="190" height="28" rx="6"/></g>
    <g font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#18181b"><text x="844" y="166">Month 1</text><text x="844" y="266">Month 3</text><text x="844" y="366">Month 6</text></g>
  </g>
</svg>
