<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Illustration: a tiger watching from the grass at golden hour near a forest lodge">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4df"/><stop offset=".6" stop-color="#fde3b0"/><stop offset="1" stop-color="#f8c87e"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7d6"/><stop offset=".55" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b99a5a"/><stop offset="1" stop-color="#8f7a45"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f7a3d"/><stop offset="1" stop-color="#55602e"/></linearGradient>
    <style>
      .glow{animation:pulse 6s ease-in-out infinite;transform-origin:880px 230px}
      @keyframes pulse{50%{transform:scale(1.06);opacity:.85}}
      .eyes,.eyeglow{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
      @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .eyeglow{animation:glowp 3s ease-in-out infinite}
      @keyframes glowp{50%{opacity:.4}}
      .bird{animation:fly 16s linear infinite}
      @keyframes fly{from{transform:translateX(-160px)}to{transform:translateX(1360px)}}
      @media (prefers-reduced-motion:reduce){.glow,.eyes,.eyeglow,.bird{animation:none}}
    </style>
  </defs>
